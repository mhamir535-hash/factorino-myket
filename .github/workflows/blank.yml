name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project ZIP
        run: |
          unzip -o factorino-myket-complete.zip -d project
          echo "Project extracted"
          find project -maxdepth 3 -type f | head -100

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: project
        run: npm install

      - name: Add Android platform
        working-directory: project
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: project
        run: npx cap sync android

      - name: Build APK
        working-directory: project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: factorino-apk
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
